version: 2
updates:
  # Docker base image (Dockerfile)
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - docker
    # Stay on the current LTS line. Node 25 is "Current" and reaches EOL well
    # before Node 24 LTS does; major bumps are reviewed manually.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

  # GitHub Actions used by workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - github-actions

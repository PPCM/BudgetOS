version: 2
updates:
  # Docker base image (Dockerfile)
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - docker

  # GitHub Actions used by workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - github-actions
